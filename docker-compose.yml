services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-focus-list}
      APP_USER: ${APP_USER:-me}
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      # Default: only this server can connect (for example nginx). Not open to the internet.
      - "${APP_PORT:-127.0.0.1:3001}:3001"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # No "ports": the database is not reachable from outside Docker.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional HTTPS with a free certificate. Needs a domain that points to your public IP.
  # Start with: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  mongo-data:
  caddy-data:
